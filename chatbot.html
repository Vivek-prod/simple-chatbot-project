<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>

    <script src="react-basics.js" defer></script>

    <!-- react library scripts -->
    <script src="https://unpkg.com/supersimpledev/react.js" defer></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js" defer></script>


    <script src="https://unpkg.com/supersimpledev/babel.js" defer></script>
  </head>

  <body>
    <div class="js-container"></div>
    
    <script type="text/babel">
        function ChatInput() {
            return (
                <>
                    <input 
                        placeholder="Send a message to Chatbot" 
                        size="30"
                    />
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage({message,sender}) {
            // const {message,sender}=props;
            /* 
            if (sender==="robot"){
                return(
                    <div>
                        <img src="./images/robot.png" width="50" />
                        {message}  
                    </div>
                );
            }
             */
            return(
                <div>
                    {sender==='robot' && (
                        <img src="./images/robot.png" width="50" />
                    )}
                    {message} 
                    {sender==='user' && (
                        <img src="./images/user.png" width="50" />
                    )}
                </div>
            );
        };

        function ChatMessages() {
            const [chatMessages,setChatMessages]=React.useState([{
                message:'hello chatbot',
                sender: 'user',
                id: 'id1'
            },{
                message:'Hello! How can I help you?',
                sender: 'robot',
                id: 'id2'
            },{
                message:'can you get me todays date?',
                sender: 'user',
                id: 'id3'
            },{
                message:'Today is August 21',
                sender: 'robot',
                id: 'id4'
            }])
            // const[ chatMessages,setChatMessages]=[chatMessages,setChatMessages]; //setChatMessage is an function which will  update the copy of message data

            function sendMessage() {
                setChatMessages([
                    ...chatMessages,
                    {
                    message:'test',
                    sender: 'user',
                    id: crypto.randomUUID()
                    }
                ]);
            }


            return(
                <>
                    <button onClick={sendMessage}>Send message</button>

                    {chatMessages.map((chatMessage)=>{

                        return (
                            <ChatMessage 
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        )
                    })}
                </>
            )
        }

        function App() {   
            return(
                <>
                    <ChatInput />  
                    <ChatMessages />  
                </> 
            )
        }

        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
