<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>

    <script src="react-basics.js" defer></script>

    <!-- react library scripts -->
    <script src="https://unpkg.com/supersimpledev/react.js" defer></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js" defer></script>


    <script src="https://unpkg.com/supersimpledev/babel.js" defer></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js" defer></script>
  </head>

  <body>
    <div class="js-container"></div>
    
    <script type="text/babel">

        function ChatInput({chatMessages,setChatMessages}) {
            const[inputText,setInputText]=React.useState('')

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function handleKeyDown(event) {
                if (event.key==='Enter'){
                    sendMessage()
                }else if (event.key==='Escape'){
                    setInputText('')
                }
            }


            function sendMessage() {
                if(inputText.trim()===''){
                    return
                }
 
                const newChatMessages=[
                    ...chatMessages,
                    {
                    message:inputText,
                    sender: 'user',
                    id: crypto.randomUUID()
                    },
                ]

                setChatMessages(newChatMessages);

                const response=Chatbot.getResponse(inputText);

                setChatMessages([
                    ...newChatMessages,
                    {
                    message:response,
                    sender: 'robot',
                    id: crypto.randomUUID()  
                    }
                ]);
                setInputText('');
            }

            return (
                <>
                    <input 
                        placeholder="Send a message to Chatbot" 
                        size="30"
                        value={inputText}
                        onChange={saveInputText}
                        onKeyDown={handleKeyDown}

                    />
                    <button 
                        onClick={sendMessage}
                    >Send</button>
                </>
            );
        }

        function ChatMessage({message,sender}) {
            return(
                <div>
                    {sender==='robot' && (
                        <img src="./images/robot.png" width="50" />
                    )}
                    {message} 
                    {sender==='user' && (
                        <img src="./images/user.png" width="50" />
                    )}
                </div>
            );
        };

        function ChatMessages({chatMessages}) {
            return(
                <>
                    {chatMessages.map((chatMessage)=>{

                        return (
                            <ChatMessage 
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        )
                    })}
                </>
            )
        }

        function App() {   
            const [chatMessages,setChatMessages]=React.useState([])
            
            return(
                <>
                    <ChatInput 
                        chatMessages={chatMessages}
                        setChatMessages={setChatMessages}/>  
                    <ChatMessages 
                        chatMessages={chatMessages}    
                    />  
                </> 
            )
        }

        
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
