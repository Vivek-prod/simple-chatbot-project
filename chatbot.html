<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>

    <script src="react-basics.js" defer></script>

    <!-- react library scripts -->
    <script src="https://unpkg.com/supersimpledev/react.js" defer></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js" defer></script>


    <script src="https://unpkg.com/supersimpledev/babel.js" defer></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js" defer></script>

    <link rel="stylesheet" href="chatbot.css">
  </head>

  <body>
    <div class="js-container"></div>
    
    <script type="text/babel">

        function ChatInput({chatMessages,setChatMessages}) {
            const[inputText,setInputText]=React.useState('')

            function saveInputText(event) {
                setInputText(event.target.value);
            }

            function handleKeyDown(event) {
                if (event.key==='Enter'){
                    sendMessage()
                }else if (event.key==='Escape'){
                    setInputText('')
                }
            }


            function sendMessage() {
                if(inputText.trim()===''){
                    return
                }
 
                const newChatMessages=[
                    ...chatMessages,
                    {
                    message:inputText,
                    sender: 'user',
                    id: crypto.randomUUID()
                    },
                ]

                setChatMessages(newChatMessages);

                const response=Chatbot.getResponse(inputText);

                setChatMessages([
                    ...newChatMessages,
                    {
                    message:response,
                    sender: 'robot',
                    id: crypto.randomUUID()  
                    }
                ]);
                
                setInputText('');
            }

            return (
                <>
                    <input 
                        placeholder="Send a message to Chatbot" 
                        
                        value={inputText}
                        onChange={saveInputText}
                        onKeyDown={handleKeyDown}
                        className='chat-input'

                    />
                    <button 

                        onClick={sendMessage}
                        className='send-button'
                    >Send</button>
                </>
            );
        }

        function ChatMessage({message,sender}) {
            return(
                
                <div className={`chat-message-container-${sender}`}>
                    {sender==='robot' && (
                        <img src="./images/robot.png" className='chat-message-profile' />
                    )}
                    <p className='chat-message-contents'>{message}</p> 
                    {sender==='user' && (
                        <img src="./images/user.png" className='chat-message-profile'/>
                    )}
                </div>
            );
        };


        function ChatMessages({chatMessages}) {
            return(
                <>
                    {chatMessages.map((chatMessage)=>{

                        return (
                            <ChatMessage 
                                message={chatMessage.message}
                                sender={chatMessage.sender}
                                key={chatMessage.id}
                            />
                        )
                    })}
                </>
            );
        }

        function App() {   
            const [chatMessages,setChatMessages]=React.useState([])

            const chatMessagesRef=React.useRef(null)

            React.useEffect(()=>{
                const containerElen=chatMessagesRef.current;
                if(containerElen){
                    containerElen.scrollTop=containerElen.scrollHeight;
                }
            },[chatMessages]);
            
            return(
                <div className='chatbot-container'>

                    <div className='chat-message-container' ref={chatMessagesRef}>

                        {chatMessages.length===0 && (
                            <div className='welcome-message'>
                                <h2>Welcome To Chatbot</h2>
                                <p>How can I help you today?</p>
                            </div>
                        )}
                        
                        <ChatMessages 
                            chatMessages={chatMessages}    
                        />

                    </div>

                    <div className='chat-input-container'>
                        <ChatInput 
                            chatMessages={chatMessages}
                            setChatMessages={setChatMessages}/>  
                    </div>
                </div> 
            )
        }

        
        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
